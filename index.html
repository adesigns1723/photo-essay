<script>
/* ============================================================

const ESSAY = {
  title: "Ang Debosyong\nHindi Nakaukit sa Bato:",
  subtitle: "Fiesta Del Pilar 2026.",
  photographer: "Bendero|Corazo|Patricio|Rabo|Rosales",
  location: "Imus, Cavite",
  year: "2026",
  theme: "Filipino Fiesta",
  hero: { src: "mary.jpg", ratio: "16/9", alt: "[Describe the opening photograph]" },

    { src: "lpureal.png", alt: "Lyceum of the Philippines University logo", label: "LPU logo" },
    { src: "cfadreal.png", alt: "LPU College of Fine Arts and Design logo", label: "CFAD logo" }
  ],
  /* Rolling preview strip before the story (moves right to left).
     It shows 10 pictures, and the visitor can scroll, drag, use the arrows or pause it. Leave src "" to reuse the matching essay photo automatically
     (1 = hero, 2-10 = photos in order), or set your own src, alt and ratio (e.g. "3/2", "4/5").
     previewSpeed is seconds per full loop: bigger = slower. Delete all entries to hide the strip. */
  previewTitle: "Fiesta Del Pilar 2026 Photo Preview",
  previewSpeed: 60,
  preview: [
    { src: "mary.jpg", alt: "Preview 1" },
    { src: "backshots.jpg", alt: "Preview 2" },
    { src: "pulis.jpg", alt: "Preview 3" },
    { src: "tindera.jpg", alt: "Preview 4" },
    { src: "vendor.jpg", alt: "Preview 5" },
    { src: "titas.jpg", alt: "Preview 6" },
    { src: "groufie.jpg", alt: "Preview 7" },
    { src: "trumpet.jpg", alt: "Preview 8" },
    { src: "bata.jpg", alt: "Preview 9" },
    { src: "side.jpg", alt: "Preview 10" }
  ],
  statement: {
    heading: "The Story",
    paragraphs: [
      "Noong Oktubre 11, nasaksihan namin ang makulay na pagdiriwang ng “Fiesta Del Pilar 2026” sa Imus, Cavite, kung saan nagtipon ang mga tao upang makiisa sa tradisyonal na “Karakol ng Imus.”  Nagsimula ang pagdiriwang sa Banal na Misa bilang pagpupugay kay Nuestra Señora del Pilar.",
      "Mula sa simbahan, bumuhay sa mga lansangan ang tugtugan, makukulay na kasuotan, at sabayang indak ng mga mananayaw. Sa bawat hakbang, dala nila ang debosyong hindi natatapos sa sayaw, kundi nagmumula sa pusong nananalig. Ngunit sa likod ng masiglang parada, patuloy sa pagtitinda ang mga naglalako, umaasang ang dagsa ng mga tao ay maghahatid ng sapat na kita para sa kanilang pamilya. Magkakaiba man ang kanilang mga dahilan sa pagdalo, bawat isa ay may dalang sariling pasaning nais nilang gumaan.",
      "Sa huli, ang tunay na debosyon ay hindi lamang nasusukat sa dami ng panalanging iniaalay sa santo, kundi sa mga sakripisyong tahimik na ginagawa ng mga tao para sa kanilang pananalig; sapagkat ang kabanalan ay hindi lamang matatagpuan sa imaheng bato at kahoy, kundi higit sa lahat, sa mga kamay ng tao na nakapako sa buhay nila."
    ],
    meta: { Location: "Imus, Cavite", Date: "October 2026" }
  },
  /* Only the hero and the closing photo are big. Everything in between sits on a fixed grid:
     grid { photos:[...], ratio:"3/2" }  -> 2 or 3 photos per row, all cropped to the same ratio so edges line up. */
  sequence: [
    { type: "grid", ratio: "3/2", photos: [
      { src: "backshots.jpg", alt: "Devotees during the Banal na Misa", caption: "A devotee stands among fellow worshippers during the Banal na Misa, wearing a shirt featuring Nuestra Señora del Pilar reflecting the deep faith and devotion woven into the community’s identity.", place: "Imus, Cavite, 2026" },
      { src: "pulis.jpg", alt: "Officers among the faithful", caption: "Beyond the cathedral walls, officers walk among the faithful, keeping watch as the streets come alive with devotion." } ] },
    { type: "grid", ratio: "4/5", photos: [
      { src: "tindera.jpg", alt: "Sampaguita vendor", caption: "A sampaguita vendor continues to offer her fragrant garlands to passing devotees, despite the weight of exhaustion and the stiffness in her arms." },
      { src: "vendor.jpg", alt: "Young vendor with a devotee", caption: "The quiet determination of a young vendor offering small goods to a devotee amid the vibrant celebration of Fiesta ng Imus." },
      { src: "titas.jpg", alt: "Woman assisting an elderly woman", caption: "A quiet care shows as a woman gently assists an elderly woman’s attire." } ] },
    { type: "grid", ratio: "1/1", photos: [
      { src: "groufie.jpg", alt: "Devotees in green Filipiniana", caption: "Devotees gather in their green floral Filipiniana for a group photo as the Karakol (street dance) starts." },
      { src: "trumpet.jpg", alt: "Musician and young performers", caption: "A seasoned musician and young performers carrying forward the rhythm of tradition during the lively procession." },
      { src: "bata.jpg", alt: "Child watching the procession", caption: "The wonder of a new generation experiencing the traditions that keep a community’s spirit alive." } ] }
  ],
  closing: {
    photo: { src: "side.jpg", ratio: "16/9", alt: "Closing photograph", caption: "At the heart of Fiesta ng Imus lies a faith carried through generations, rooted in love and hope that lives on long beyond the celebration." },
    text: "As the festivities come to a close, the streets grow quiet, but the faith remains loud. The spirit of Fiesta ng Imus lives on, in every prayer,\n every act of kindness, and every return to the faith that brings the community together."
  },
  about: {
    bio: "A group of Multimedia Arts Students from Lyceum of the Philippines University gathered to capture the beauty and significance of a traditional Fiesta",
    email: "gunitastudio@gmail.com"
  }
};

/* ---------------- renderer ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let n = 0;

function fig(p, { eager = false, num = true, fixed = false } = {}) {
  const k = num ? String(++n).padStart(2, "0") : "";
  const frame = p.src
    ? `<img src="${esc(p.src)}" alt="${esc(p.alt)}" ${eager ? "" : 'loading="lazy"'} decoding="async" ${fixed ? "" : `onload="this.parentNode.style.aspectRatio=this.naturalWidth+'/'+this.naturalHeight"`} onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph',innerHTML:'<b>Image not found</b>${esc(p.src)}'}))">`
    : `<div class="ph t${(n % 3) + 1}" role="img" aria-label="Placeholder: ${esc(p.alt)}"><b>Placeholder photo ${k}</b><span>${esc(p.ratio.replace("/", ":"))}</span><span>Set src in ESSAY</span></div>`;
  const cap = (p.caption || p.place || num)
    ? `<figcaption>${num ? `<span class="n">${k}</span>` : ""}<span>${esc(p.caption || "")}${p.caption && p.place ? " · " : ""}${esc(p.place || "")}</span></figcaption>` : "";
  return `<figure class="rv"><div class="frame" style="aspect-ratio:${esc(p.ratio)}">${frame}</div>${p.caption || p.place ? cap : ""}</figure>`;
}

const layouts = {
  chapter: i => `<section class="chapter rv"><span class="label">Chapter ${esc(i.label)}</span><h2>${esc(i.title)}</h2></section>`,
  pause: i => `<section class="pause ${i.side ? "side" : ""} rv"><p>${esc(i.text)}</p></section>`,
  full: i => `<section class="full">${fig(i.photo)}</section>`,
  wide: i => `<section class="row"><div class="wide">${fig(i.photo)}</div></section>`,
  center: i => `<section class="row"><div class="center">${fig(i.photo)}</div></section>`,
  portrait: i => `<section class="row"><div class="portrait ${i.align || ""}">${fig(i.photo)}</div></section>`,
  asym: i => `<section class="row"><div class="wide asym ${i.flip ? "flip" : ""}">${fig(i.a)}${fig(i.b)}</div></section>`,
  diptych: i => `<section class="row"><div class="wide diptych">${fig(i.a)}${fig(i.b)}</div></section>`,
  grid: i => `<section class="row"><div class="wide grid g${i.photos.length}">${i.photos.map(p => fig({ ...p, ratio: i.ratio }, { fixed: true })).join("")}</div></section>`,
  split: i => `<section class="row"><div class="wide split">${fig(i.photo)}<div class="note rv"><p>${esc(i.note)}</p></div></div></section>`
};

function build() {
  const E = ESSAY;
  document.title = `${E.title.replace(/\s*\n\s*/g, " ")} ${E.subtitle.replace(/\.$/, "")}`;
  const heroFrame = E.hero.src
    ? `<img src="${esc(E.hero.src)}" alt="${esc(E.hero.alt)}" fetchpriority="high">`
    : `<div class="ph" role="img" aria-label="Placeholder: ${esc(E.hero.alt)}"><b>Placeholder hero photograph</b><span>Set ESSAY.hero.src</span></div>`;
  const logos = (E.logos || []).map(l => l.src
    ? `<img src="${esc(l.src)}" alt="${esc(l.alt)}" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'logo-ph',textContent:'Logo not found'}))">`
    : `<span class="logo-ph" role="img" aria-label="Placeholder: ${esc(l.alt)}">${esc(l.label || 'Logo')}</span>`).join("");
  const pool = [E.hero];
  E.sequence.forEach(i => { ["photo", "a", "b"].forEach(k => i[k] && pool.push(i[k])); (i.photos || []).forEach(p => pool.push(p)); });
  const items = (E.preview || []).map((p, k) => { const s = pool[k] || {}; return { src: p.src || s.src || "", alt: p.alt || s.alt || "", ratio: p.ratio || s.ratio || "3/2" }; });
  const card = (p, k, hid) => `<div class="item" style="aspect-ratio:${esc(p.ratio)}"${hid ? ' aria-hidden="true"' : ""}><div class="frame" style="height:100%">${p.src ? `<img src="${esc(p.src)}" alt="${hid ? "" : esc(p.alt)}" decoding="async" onload="this.parentNode.parentNode.style.aspectRatio=this.naturalWidth+'/'+this.naturalHeight">` : `<div class="ph t${(k % 3) + 1}"><b>Preview ${k + 1}</b><span>Set src in ESSAY.preview</span></div>`}</div></div>`;
  const ic = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const copies = [0, 1, 2].map(c => items.map((p, k) => card(p, k, c > 0)).join("")).join("");
  const reel = items.length ? `<section class="reel" aria-label="${esc(E.previewTitle)}"><div class="reel-head"><span class="label">${esc(E.previewTitle)}</span></div><div class="track" id="track" tabindex="0" role="region" aria-label="Photo preview. Drag, scroll or use the left and right arrow keys.">${copies}</div></section>` : "";
  const st = E.statement;
  const html = `
  <section class="hero" id="hero">
    <div class="frame" style="height:100%">${heroFrame}</div>
    ${logos ? `<div class="logos">${logos}</div>` : ""}
    <h1>${esc(E.title)}</h1>
    <p>${esc(E.subtitle)}</p>
    <div class="meta label" style="color:#e4ddcf"><span>${esc(E.photographer)}</span><span>${esc(E.location)}, ${esc(E.year)}</span></div>
  </section>
  ${reel}
  <section class="statement" id="about-essay"><div class="rv">
    <span class="label">${esc(E.theme)}</span>
    <h2>${esc(st.heading)}</h2>
    ${st.paragraphs.map(p => `<p>${esc(p)}</p>`).join("")}
    <dl>${Object.entries(st.meta).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
  </div></section>
  <div id="essay">${E.sequence.map(i => (layouts[i.type] || (() => ""))(i)).join("")}</div>
  <section class="full closing-photo">${fig(E.closing.photo)}</section>
  <section class="closing rv">
    <p class="q">${esc(E.closing.text)}</p>
    <span class="label">${esc(E.photographer)}</span>
    <span class="label">${esc(E.title.replace(/:\s*$/, ""))}, ${esc(E.year)}</span>
  </section>`;
  $("#main").innerHTML = html;
  const A = E.about;
  $("footer").innerHTML = `
    <div id="about"><h3>${esc(E.photographer)}</h3><p>${esc(A.bio)}</p></div>
    <div><h3>Contact</h3><p><a href="mailto:${esc(A.email)}">${esc(A.email)}</a></p></div>
    <p class="copy">© ${esc(E.year)} ${esc(E.photographer)}. All photographs and text reserved.</p>`;
}
build();

/* reveal on scroll */
const els = document.querySelectorAll(".rv");
if ("IntersectionObserver" in window) {
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { rootMargin: "0px 0px -8% 0px", threshold: .05 });
  els.forEach(el => io.observe(el));
} else document.documentElement.classList.add("noanim");

/* progress */
const bar = $("#bar");
const prog = () => { const h = document.documentElement.scrollHeight - innerHeight; bar.style.transform = `scaleX(${h > 0 ? Math.min(1, scrollY / h) : 0})`; };
addEventListener("scroll", prog, { passive: true }); addEventListener("resize", prog); prog();

/* mobile menu */
const btn = $("#menuBtn"), nav = $("#nav"), head = $("#top");
const setMenu = o => { nav.classList.toggle("open", o); head.classList.toggle("open", o); btn.setAttribute("aria-expanded", o); btn.setAttribute("aria-label", o ? "Close menu" : "Open menu"); };
btn.addEventListener("click", () => setMenu(!nav.classList.contains("open")));
nav.addEventListener("click", e => { if (e.target.tagName === "A") setMenu(false); });
addEventListener("keydown", e => { if (e.key === "Escape") setMenu(false); });
document.addEventListener("click", e => { if (nav.classList.contains("open") && !nav.contains(e.target) && !btn.contains(e.target)) setMenu(false); });

/* light / dark toggle (remembers the visitor's choice) */
const root = document.documentElement, tb = $("#themeBtn");
const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme:dark)").matches;
const lbl = $("#themeLbl");
const paint = () => { const d = isDark(); tb.dataset.mode = d ? "dark" : "light"; lbl.textContent = d ? "Light" : "Dark"; tb.setAttribute("aria-label", d ? "Switch to light mode" : "Switch to dark mode"); };
matchMedia("(prefers-color-scheme:dark)").addEventListener?.("change", paint);
tb.addEventListener("click", () => { const t = isDark() ? "light" : "dark"; root.dataset.theme = t; try { localStorage.setItem("theme", t); } catch (e) {} paint(); });
paint();


/* controllable photo preview: arrows, drag, scroll, keyboard, play / pause */
(() => {
  const tr = $("#track"); if (!tr) return;
  const per = +ESSAY.previewSpeed || 60;
  const playing = !matchMedia("(prefers-reduced-motion:reduce)").matches;
  let hold = false, busy = false, pos = 0, last = 0, t0 = 0, releaseT;
  const setW = () => { const a = tr.children, n = a.length / 3; return a[n].offsetLeft - a[0].offsetLeft; };
  const wrap = () => { const w = setW(); if (!w) return; if (tr.scrollLeft >= 2 * w) tr.scrollLeft -= w; else if (tr.scrollLeft < 1) tr.scrollLeft += w; };
  const home = () => { tr.scrollLeft = setW(); pos = tr.scrollLeft; };
  const go = dir => {
    if (busy) return; busy = true;
    const dist = dir * Math.max(240, tr.clientWidth * .8), dur = 520, s = performance.now(); let done = 0;
    const step = now => {
      const k = Math.min(1, (now - s) / dur), e = 1 - Math.pow(1 - k, 3), inc = dist * e - done; done = dist * e;
      tr.scrollLeft += inc; wrap(); pos = tr.scrollLeft;
      k < 1 ? requestAnimationFrame(step) : (busy = false);
    };
    requestAnimationFrame(step);
  };
  const tick = now => {
    const dt = Math.min(64, now - (last || now)); last = now;
    if (playing && !hold && !busy) {
      if (Math.abs(tr.scrollLeft - pos) > 1.5) pos = tr.scrollLeft;
      pos += dt / 1000 * (setW() / per); tr.scrollLeft = pos; wrap(); pos = Math.max(pos, 0);
    }
    requestAnimationFrame(tick);
  };
  tr.addEventListener("scroll", wrap, { passive: true });
  tr.addEventListener("keydown", e => { if (e.key === "ArrowLeft") { e.preventDefault(); go(-1); } else if (e.key === "ArrowRight") { e.preventDefault(); go(1); } });
  /* pause while the visitor is interacting */
  const on = () => { clearTimeout(releaseT); hold = true; }, off = (ms = 0) => { clearTimeout(releaseT); releaseT = setTimeout(() => hold = false, ms); };
  tr.addEventListener("mouseenter", on); tr.addEventListener("mouseleave", () => off());
  tr.addEventListener("focusin", on); tr.addEventListener("focusout", () => off());
  tr.addEventListener("touchstart", on, { passive: true }); tr.addEventListener("touchend", () => off(1800));
  /* mouse drag */
  let down = false, sx = 0, sl = 0;
  tr.addEventListener("pointerdown", e => { if (e.pointerType !== "mouse") return; down = true; sx = e.clientX; sl = tr.scrollLeft; tr.classList.add("drag"); tr.setPointerCapture(e.pointerId); });
  tr.addEventListener("pointermove", e => { if (!down) return; tr.scrollLeft = sl - (e.clientX - sx); wrap(); pos = tr.scrollLeft; });
  const up = () => { down = false; tr.classList.remove("drag"); };
  tr.addEventListener("pointerup", up); tr.addEventListener("pointercancel", up);
  home(); addEventListener("load", home); addEventListener("resize", () => { pos = tr.scrollLeft; });
  requestAnimationFrame(tick);
})();

/* soft blur at the top and bottom edges while scrolling */
const eT = $(".edge.top"), eB = $(".edge.bottom");
const edges = () => { const max = document.documentElement.scrollHeight - innerHeight; eT.classList.toggle("on", scrollY > 60); eB.classList.toggle("on", scrollY > 60 && scrollY < max - 120); };
addEventListener("scroll", edges, { passive: true }); addEventListener("resize", edges); edges();
</script>
</body>
</html>
